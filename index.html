<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fume hood booking</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#129514;</text></svg>">
</head>
<body>

  <!-- Password gate -->
  <div id="gate" class="gate">
    <form id="gate-form" class="gate-card" autocomplete="off">
      <h1 class="gate-title">🧪 <span id="gate-hood">Fume hood</span></h1>
      <p class="gate-sub">Enter the lab password to see the booking calendar.</p>
      <input id="gate-input" type="password" placeholder="Password" aria-label="Lab password" required>
      <button type="submit">Unlock</button>
      <p id="gate-error" class="gate-error" hidden>Wrong password.</p>
    </form>
  </div>

  <!-- App -->
  <div id="app" hidden>
    <header class="topbar">
      <div class="topbar-left">
        <h1 id="hood-name">Fume hood</h1>
        <span id="mode-badge" class="badge" hidden></span>
      </div>
      <div class="topbar-right">
        <label class="who">
          Booking as
          <input id="who-input" type="text" placeholder="Your name" maxlength="40" autocomplete="off">
        </label>
        <a class="ghost linkbtn" href="stats.html">Statistics</a>
        <button id="lock-btn" class="ghost" title="Lock and forget the password">Lock</button>
      </div>
    </header>

    <nav class="weekbar">
      <button id="prev-week" class="ghost">← Previous</button>
      <button id="this-week" class="ghost">This week</button>
      <button id="next-week" class="ghost">Next →</button>
      <span id="week-label" class="week-label"></span>
      <span id="status" class="status" role="status"></span>
    </nav>

    <main class="grid-wrap">
      <table id="grid" class="grid"></table>
    </main>

    <footer class="hints">
      <p>Click a free slot to book it, or drag down a column to book several hours in a row. Click a booking to release it.</p>
    </footer>

    <dialog id="release-dialog" class="modal" aria-labelledby="release-title">
      <h2 id="release-title">Release booking</h2>
      <p id="release-body"></p>
      <div class="modal-actions">
        <button type="button" id="release-keep" class="ghost">Keep it</button>
        <button type="button" id="release-one"></button>
        <button type="button" id="release-block" class="danger"></button>
      </div>
    </dialog>
  </div>

  <script src="config.js"></script>
  <script src="store.js"></script>
  <script src="gate.js"></script>
  <script src="app.js"></script>
</body>
</html>
